<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flipbook by deluluprinter.xyz</title>
    <meta name="description" content="Turn your videos and moments into aesthetic flipbooks.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;900&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            cyan: '#00FFFF', magenta: '#FF00FF', yellow: '#FFEA00',
                            black: '#111111', green: '#25D366', purple: '#d500f9', blue: '#2962ff'
                        }
                    },
                    boxShadow: {
                        'brutal': '6px 6px 0px 0px rgba(17, 17, 17, 1)',
                        'brutal-sm': '3px 3px 0px 0px rgba(17, 17, 17, 1)',
                        'brutal-md': '4px 4px 0px 0px rgba(17, 17, 17, 1)',
                        'brutal-lg': '10px 10px 0px 0px rgba(17, 17, 17, 1)',
                        'brutal-white': '4px 4px 0px 0px rgba(255, 255, 255, 1)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #E2E8F0; /* Soft gray backing */
            background-image: radial-gradient(#94a3b8 1.5px, transparent 1.5px);
            background-size: 20px 20px;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .brutal-btn {
            border: 3px solid #111;
            box-shadow: 4px 4px 0px 0px #111;
            transition: all 0.1s ease;
        }
        .brutal-btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px 0px #111; }
        .brutal-btn:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0px 0px 0px 0px #111; }

        .errbar {
            position: fixed; inset: 0 0 auto 0; z-index: 9999;
            background: #FF00FF; color: #fff; border-bottom: 4px solid #111;
            font-family: 'Space Grotesk', sans-serif; font-weight: 700;
            padding: 10px 14px; white-space: pre-wrap; box-shadow: 6px 6px 0px 0px #111;
        }
        [hidden] { display: none !important; }
        
        /* Scene Management */
        .bookwrap, .camwrap, .stitching, .trouble { display: none; }
        body[data-scene="intro"] .bookwrap, body[data-scene="book"] .bookwrap { display: flex; }
        body[data-scene="live"] .camwrap, body[data-scene="countdown"] .camwrap, body[data-scene="recording"] .camwrap { display: flex; }
        body[data-scene="stitch"] .stitching { display: flex; }
        body[data-scene="trouble"] .trouble { display: flex; }

        /* Camera Window */
        .camwindow {
            position: relative; width: 100%; max-width: 600px; aspect-ratio: 4 / 3;
            background: #111; border: 4px solid #111; box-shadow: 8px 8px 0px 0px #111;
            overflow: hidden; border-radius: 12px; margin: 0 auto;
        }
        #video, .fakecam { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); filter: saturate(1.1) contrast(1.1); }
        .fakecam[hidden] { display: none; }

        .countdown {
            position: absolute; inset: 0; display: grid; place-items: center;
            font-size: clamp(90px, 20vw, 190px); font-family: 'Space Grotesk', sans-serif; font-weight: 900;
            color: #FFEA00; text-shadow: 4px 4px 0px #111; z-index: 7; pointer-events: none;
        }
        .countdown span { display: block; animation: pop 0.9s ease-out; }
        @keyframes pop {
            0% { transform: scale(0.4) rotate(-14deg); opacity: 0; }
            22% { transform: scale(1.14) rotate(4deg); opacity: 1; }
            55% { transform: scale(1) rotate(-1deg); opacity: 1; }
            100% { transform: scale(0.9) rotate(0deg); opacity: 0.15; }
        }

        .recbadge {
            position: absolute; top: 16px; left: 16px; z-index: 7; display: flex; align-items: center; gap: 8px;
            font-family: 'Space Grotesk', sans-serif; font-weight: 900; font-size: 20px; color: #fff; text-shadow: 2px 2px 0px #111;
        }
        .recbadge .dot { width: 16px; height: 16px; border-radius: 50%; background: #FF00FF; border: 2px solid #111; animation: blink 1s steps(1) infinite; }
        @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }

        .framecount {
            position: absolute; right: 16px; bottom: 14px; z-index: 7;
            font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 900; color: #00FFFF; text-shadow: 2px 2px 0px #111;
        }
        .flash { position: absolute; inset: 0; z-index: 8; background: #fff; opacity: 0; pointer-events: none; }
        .flash.pop { animation: flashpop 0.22s ease-out; }
        @keyframes flashpop { 0% { opacity: 0.85; } 100% { opacity: 0; } }

        /* Thumbnails Strip */
        .shots {
            display: flex; gap: 6px; width: 100%; max-width: 600px;
            align-items: center; justify-content: center; flex-wrap: wrap; margin: 16px auto 0;
        }
        .shots canvas {
            width: calc(16.666% - 6px); aspect-ratio: 4/3; border: 2px solid #111; background: #fff; box-shadow: 2px 2px 0px 0px #111;
            transform: rotate(var(--r, 0deg)); animation: shotin 0.34s ease-out backwards; object-fit: cover;
        }
        @keyframes shotin { 0% { transform: translateY(-30px) scale(1.5); opacity: 0; } 100% { transform: translateY(0) scale(1) rotate(var(--r, 0deg)); opacity: 1; } }

        /* Controls Layout */
        .controls-panel > .row, .controls-panel > .scrubwrap { display: none; }
        body[data-scene="intro"] .row-intro { display: flex; }
        body[data-scene="live"] .row-live { display: flex; }
        body[data-scene="countdown"] .row-recording { display: flex; }
        body[data-scene="recording"] .row-recording { display: flex; }
        body[data-scene="book"] .row-book { display: flex; }
        body[data-scene="book"] .scrubwrap { display: flex; flex-direction: column; }

        /* Scrubber */
        .scrub { position: relative; width: 100%; height: 40px; cursor: pointer; touch-action: none; border: 3px solid #111; background: #fff; border-radius: 8px; box-shadow: 4px 4px 0px 0px #111; margin-top: 8px;}
        .scrubmark { position: absolute; top: 50%; left: 0; width: 28px; height: 40px; margin: -20px 0 0 -14px; pointer-events: none; background: #00FFFF; border: 3px solid #111; border-radius: 4px; transition: none; }
        .scrubticks { position: absolute; inset: 0; pointer-events: none; display: flex; justify-content: space-between; padding: 0 4px; align-items: center; }
        .scrubticks div { width: 2px; height: 12px; background: rgba(17,17,17,0.2); }
        .scrubticks div:nth-child(5n+1) { height: 20px; background: rgba(17,17,17,0.5); }
        
        /* Book Canvas Container */
        .bookwrap { position: relative; z-index: 3; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
        .book { width: 100%; max-width: 900px; height: min(54vh, 470px); min-height: 260px; display: block; touch-action: none; cursor: grab; outline: none; border-radius: 4px; margin: 0 auto;}
        .book.grabbing { cursor: grabbing; }

        /* Selectable Options (Pills) */
        .pace-pill[aria-checked="true"] { background: #FFEA00; box-shadow: 3px 3px 0px 0px #111; transform: translate(-2px, -2px); border-color: #111; }
        .pace-pill { padding: 6px 14px; border: 2px solid #ddd; background: #fff; border-radius: 12px; font-weight: 700; color: #111; transition: all 0.2s; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-size: 14px;}
        .speed-pill[aria-checked="true"] { background: #FF00FF; color: #fff; box-shadow: 3px 3px 0px 0px #111; transform: translate(-2px, -2px); border-color: #111; }
        .speed-pill { padding: 6px 14px; border: 2px solid #ddd; background: #fff; border-radius: 12px; font-weight: 700; color: #111; transition: all 0.2s; cursor: pointer; font-family: 'Space Grotesk', sans-serif; font-size: 14px;}

        /* Floating Stickers */
        .sticker { position: absolute; pointer-events: none; z-index: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 900; border: 3px solid #111; padding: 4px 12px; box-shadow: 4px 4px 0px #111; text-transform: uppercase; letter-spacing: 1px; }

        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-marquee { animation: marquee 20s linear infinite; }
    </style>
</head>
<body class="text-brand-black flex flex-col min-h-screen" data-scene="intro">

    <div id="errbar" class="errbar" hidden></div>
    <input type="file" id="video-upload" class="hidden" accept="video/mp4,video/webm,video/ogg,video/quicktime">

    <header class="fixed top-0 w-full z-40 flex flex-col shadow-sm">
        <div class="w-full bg-brand-cyan border-b-4 border-brand-black px-4 py-2 overflow-hidden flex whitespace-nowrap">
            <div class="animate-marquee font-bold text-xs md:text-sm inline-block font-display">
                <span class="mx-4 text-brand-black">🚀 <b>FLIPBOOTH</b> IS NOW LIVE!</span>
                <span class="mx-4 text-brand-magenta">✨ TURN YOUR VIDEOS INTO VIRTUAL PAPER</span>
                <span class="mx-4 text-brand-black">🚀 <b>FLIPBOOTH</b> IS NOW LIVE!</span>
                <span class="mx-4 text-brand-magenta">✨ TURN YOUR VIDEOS INTO VIRTUAL PAPER</span>
            </div>
        </div>
        <nav class="w-full bg-white/95 backdrop-blur-md border-b-4 border-brand-black">
            <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-2 cursor-pointer select-none">
                    <i class="ph-fill ph-book-open text-3xl md:text-4xl text-brand-magenta"></i>
                    <span class="font-display font-black text-xl md:text-2xl tracking-tight leading-none">flipbooth<span class="text-sm"> by deluluprinter</span></span>
                </div>
            </div>
        </nav>
    </header>

    <main class="pt-32 md:pt-36 flex-grow w-full pb-8 flex flex-col relative z-10" id="stage">
        
        <!-- Decorative Stickers (Hidden on very small screens) -->
        <div class="hidden md:block sticker bg-brand-yellow text-black rotate-[-6deg] top-40 left-10 text-2xl">WOW!</div>
        <div class="hidden lg:block sticker bg-brand-cyan text-black rotate-[12deg] bottom-20 left-16 text-xl">100% MAGIC</div>
        <div class="hidden md:block sticker bg-brand-magenta text-white rotate-[-4deg] top-52 right-12 text-xl">SO BRUTAL</div>
        <div class="hidden lg:block sticker bg-white text-black rotate-[8deg] bottom-32 right-20 text-2xl">FLIP IT!</div>

        <div class="w-full max-w-5xl mx-auto px-4 flex-grow flex flex-col justify-center items-center relative z-10">
            
            <!-- Book View -->
            <div class="bookwrap" id="bookwrap">
                <canvas id="book" class="book" tabindex="0" role="application" aria-label="Flipbook"></canvas>
                <div class="mt-6 inline-block bg-brand-black text-white px-6 py-2 border-2 border-white rounded-lg shadow-brutal-white font-bold font-display rotate-[-1deg]" id="bookhint">
                    Drag a page to flip • or press SPACE
                </div>
            </div>

            <!-- Camera View -->
            <div class="camwrap w-full" id="camwrap">
                <div class="camwindow" id="camwindow">
                    <video id="video" playsinline muted autoplay></video>
                    <canvas id="fakecam" class="fakecam" hidden></canvas>
                    <div class="countdown" id="countdown" aria-live="assertive"></div>
                    <div class="recbadge" id="recbadge" hidden><span class="dot"></span>REC</div>
                    <div class="framecount" id="framecount" hidden>00/24</div>
                    <div class="flash" id="flash"></div>
                </div>
                <div class="shots" id="shots" aria-hidden="true"></div>
            </div>

            <!-- Stitching View -->
            <div class="stitching w-full max-w-md mx-auto text-center bg-white border-4 border-black p-8 rounded-2xl shadow-brutal" id="stitching">
                <i class="ph-duotone ph-aperture text-6xl text-brand-magenta mb-4 animate-spin block mx-auto w-fit"></i>
                <h2 id="stitchtext" class="font-display text-3xl font-black mb-4 uppercase">Stitching...</h2>
                <div class="w-full h-8 border-4 border-black bg-gray-100 rounded-full overflow-hidden p-1 shadow-inner">
                    <div class="h-full bg-gradient-to-r from-brand-cyan to-brand-blue rounded-full transition-all duration-300" style="width: 0%" id="stitchfill"></div>
                </div>
            </div>

            <!-- Trouble View -->
            <div class="trouble w-full max-w-lg mx-auto" id="trouble">
                <div class="bg-white border-4 border-brand-black p-8 rounded-2xl shadow-brutal text-center">
                    <h2 id="troubletitle" class="font-display text-3xl font-black text-brand-magenta mb-4 uppercase">Hmm.</h2>
                    <p id="troublebody" class="font-bold text-gray-700 mb-6"></p>
                    <div class="flex flex-wrap gap-4 justify-center">
                        <button class="brutal-btn bg-brand-yellow px-6 py-3 rounded-xl font-black uppercase tracking-wide" data-act="retry-camera">Try Again</button>
                        <button class="brutal-btn bg-white px-6 py-3 rounded-xl font-black uppercase tracking-wide" data-act="use-demo">Use Demo</button>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <footer class="w-full max-w-4xl mx-auto px-4 pb-12 relative z-20">
        <div class="controls-panel bg-white border-4 border-brand-black p-6 md:p-8 rounded-2xl shadow-brutal-lg flex flex-col items-center gap-6">
            
            <!-- Intro Screen Controls -->
            <div class="row row-intro flex-wrap justify-center gap-4 w-full">
                <button class="brutal-btn flex-1 min-w-[200px] bg-brand-cyan text-brand-black px-6 py-4 rounded-xl font-display font-black text-lg flex justify-center items-center gap-2" onclick="document.getElementById('video-upload').click()">
                    <i class="ph-bold ph-upload-simple text-2xl"></i> Upload Video
                </button>
                <button class="brutal-btn flex-1 min-w-[200px] bg-brand-yellow text-brand-black px-6 py-4 rounded-xl font-display font-black text-lg flex justify-center items-center gap-2" data-act="start">
                    <i class="ph-bold ph-camera text-2xl"></i> Record Webcam
                </button>
                <button class="brutal-btn w-full md:w-auto bg-gray-100 text-brand-black px-6 py-4 rounded-xl font-display font-black text-lg flex justify-center items-center gap-2" data-act="use-demo">
                    <i class="ph-bold ph-play text-2xl"></i> Try Demo
                </button>
            </div>

            <!-- Live Camera Controls -->
            <div class="row row-live flex-col items-center w-full">
                <div class="flex items-center gap-3 mb-4">
                    <span class="font-bold text-gray-500 text-sm uppercase tracking-widest">Capture Speed:</span>
                    <div class="flex flex-wrap justify-center gap-2" id="paces" role="radiogroup"></div>
                </div>
                <div class="flex flex-wrap justify-center gap-4 w-full">
                    <button class="brutal-btn flex-1 max-w-[300px] bg-brand-magenta text-white px-8 py-4 rounded-xl font-display font-black text-xl flex justify-center items-center gap-2 uppercase tracking-wide" data-act="record">
                        <i class="ph-fill ph-record text-2xl"></i> Start Recording
                    </button>
                    <button class="brutal-btn bg-gray-100 text-brand-black px-6 py-4 rounded-xl font-bold text-lg uppercase" data-act="back-intro">Cancel</button>
                </div>
            </div>

            <div class="row row-recording w-full justify-center">
                <button class="brutal-btn bg-brand-black text-white px-10 py-4 rounded-xl font-black text-xl uppercase tracking-widest animate-pulse" data-act="cancel-record">Stop Recording</button>
            </div>

            <!-- Book Controls -->
            <div class="row row-book flex-col w-full">
                <!-- Play/Scrub Header -->
                <div class="flex flex-wrap justify-between items-center w-full gap-4 mb-2">
                    <div class="flex gap-2">
                        <button class="brutal-btn bg-white px-4 py-2 rounded-lg font-black text-xl" data-act="prev"><i class="ph-bold ph-caret-left"></i></button>
                        <button class="brutal-btn bg-brand-magenta text-white px-6 py-2 rounded-lg font-display font-black text-lg uppercase tracking-widest min-w-[120px]" data-act="play" id="play-btn">Flip It!</button>
                        <button class="brutal-btn bg-white px-4 py-2 rounded-lg font-black text-xl" data-act="next"><i class="ph-bold ph-caret-right"></i></button>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-gray-500 text-sm uppercase tracking-widest">Flip Speed:</span>
                        <div class="flex gap-2" id="speeds" role="radiogroup"></div>
                    </div>
                </div>

                <!-- Scrubber -->
                <div class="scrubwrap w-full mb-6 text-center" id="scrubwrap">
                    <div class="scrub" id="scrub" role="slider" tabindex="0" aria-valuemin="1" aria-valuenow="1" aria-valuemax="24">
                        <div class="scrubticks" id="scrubticks"></div>
                        <div class="scrubmark" id="scrubmark"></div>
                    </div>
                    <p class="pagelabel font-bold text-sm text-gray-500 mt-2 font-display uppercase tracking-widest" id="pagelabel">Page 1 of 24</p>
                </div>

                <!-- Actions -->
                <div class="flex flex-wrap justify-center gap-4 w-full pt-4 border-t-2 border-dashed border-gray-300">
                    <button class="brutal-btn flex-1 min-w-[160px] bg-brand-cyan text-brand-black px-4 py-3 rounded-xl font-black uppercase text-sm flex justify-center items-center gap-2" data-act="gif" id="btn-gif">
                        <i class="ph-bold ph-file-gif text-xl"></i> Save GIF
                    </button>
                    <button class="brutal-btn flex-1 min-w-[160px] bg-brand-green text-white px-4 py-3 rounded-xl font-black uppercase text-sm flex justify-center items-center gap-2" data-act="print" id="btn-print">
                        <i class="ph-bold ph-printer text-xl"></i> Print PDF
                    </button>
                    <button class="brutal-btn flex-1 min-w-[160px] bg-brand-yellow text-brand-black px-4 py-3 rounded-xl font-black uppercase text-sm flex justify-center items-center gap-2" data-act="again">
                        <i class="ph-bold ph-arrow-counter-clockwise text-xl"></i> Start Over
                    </button>
                </div>
            </div>
        </div>
    </footer>

<script>
(function() {

const errbar = document.getElementById('errbar');
function showError(what, e) {
    const msg = `${what}: ${(e && (e.stack || e.message)) || e}`;
    errbar.hidden = false;
    errbar.textContent = (errbar.textContent ? errbar.textContent + '\n\n' : '') + msg;
    console.error(what, e);
}
window.addEventListener('error', (e) => showError('error', e.error || e.message));
window.addEventListener('unhandledrejection', (e) => showError('unhandled rejection', e.reason));

const FRAME_COUNT = 24;
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

/* --- AUDIO --- */
let ctxAudio = null;
let muted = false;
let noiseBuffer = null;

function audio() {
    if (ctxAudio) return ctxAudio;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctxAudio = new AC();
    return ctxAudio;
}
function getNoise(ac) {
    if (noiseBuffer && noiseBuffer.sampleRate === ac.sampleRate) return noiseBuffer;
    const len = Math.floor(ac.sampleRate * 0.35);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    noiseBuffer = buf; return buf;
}
function unlock() { const ac = audio(); if (ac && ac.state === 'suspended') ac.resume().catch(() => {}); }
function burst({ freq = 2400, q = 0.9, dur = 0.09, gain = 0.16, type = 'bandpass' } = {}) {
    if (muted) return; const ac = audio(); if (!ac || ac.state === 'suspended') return;
    const src = ac.createBufferSource(); src.buffer = getNoise(ac); src.playbackRate.value = 0.85 + Math.random() * 0.4;
    const filter = ac.createBiquadFilter(); filter.type = type; filter.frequency.value = freq * (0.86 + Math.random() * 0.28); filter.Q.value = q;
    const amp = ac.createGain(); const t0 = ac.currentTime;
    amp.gain.setValueAtTime(0, t0); amp.gain.linearRampToValueAtTime(gain, t0 + 0.005); amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(filter).connect(amp).connect(ac.destination); src.start(t0); src.stop(t0 + dur + 0.02);
}
function riffle() { burst({ freq: 2600, q: 0.8, dur: 0.085, gain: 0.14 }); }
function land() { burst({ freq: 900, q: 0.7, dur: 0.13, gain: 0.1, type: 'lowpass' }); }
function shutter() { burst({ freq: 5200, q: 3.5, dur: 0.045, gain: 0.2 }); setTimeout(() => burst({ freq: 1500, q: 1.2, dur: 0.07, gain: 0.11 }), 55); }
function tickSfx() { burst({ freq: 1800, q: 6, dur: 0.05, gain: 0.09 }); }

/* --- CONSTANTS & CONFIG --- */
const PACES = [
    { id: 'slow', fps: 2, label: 'Slow' },
    { id: 'normal', fps: 3, label: 'Stop-Motion' },
    { id: 'quick', fps: 6, label: 'Quick' },
];
const SPEEDS = [
    { id: 'slowmo', fps: 4, label: 'Slow-Mo' },
    { id: 'normal', fps: 10, label: 'Normal' },
    { id: 'zoom', fps: 18, label: 'Zoom' },
];
const paceById = (id) => PACES.find((p) => p.id === id) || PACES[1];
const speedById = (id) => SPEEDS.find((s) => s.id === id) || SPEEDS[1];
const PAGE = { w: 480, h: 360, scale: 2, gutter: 52, margin: 17, footer: 42 };

let bindEdge = 'left';
function setBindEdge(edge) { bindEdge = edge === 'top' ? 'top' : 'left'; }
function getBindEdge() { return bindEdge; }
function photoBox() {
    if (bindEdge === 'top') return { x: PAGE.margin, y: PAGE.gutter, w: PAGE.w - PAGE.margin * 2, h: PAGE.h - PAGE.gutter - PAGE.footer };
    return { x: PAGE.gutter, y: PAGE.margin, w: PAGE.w - PAGE.gutter - PAGE.margin, h: PAGE.h - PAGE.margin - PAGE.footer };
}
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.round(w); c.height = Math.round(h); return c; }

/* --- CAPTURE LOGIC --- */
async function extractFramesFromVideo(file, count, onProgress) {
    return new Promise((resolve, reject) => {
        const video = document.createElement('video'); video.preload = 'auto'; video.muted = true; video.playsInline = true;
        const url = URL.createObjectURL(file); video.src = url;
        video.onloadeddata = async () => {
            try {
                let dur = video.duration;
                if (!dur || dur === Infinity) { video.currentTime = 1e10; await new Promise(r => video.onseeked = r); dur = video.currentTime; video.currentTime = 0; await new Promise(r => video.onseeked = r); }
                const interval = dur / count; const frames = []; const w = video.videoWidth; const h = video.videoHeight;

        this.page.ops.push('q'); if (opts.fillGray != null) this.page.ops.push(`${num(opts.fillGray)} g ${num(x)} ${num(y)} ${num(w)} ${num(h)} re f`);
        if (opts.gray != null || opts.width != null || opts.dash) { this.page.ops.push(this._stroke(opts)); this.page.ops.push(`${num(x)} ${num(y)} ${num(w)} ${num(h)} re S`); }
        this.page.ops.push('Q'); return this;
    }
    line(x1, y1, x2, y2, opts = {}) { this.page.ops.push(`q ${this._stroke(opts)} ${num(x1)} ${num(y1)} m ${num(x2)} ${num(y2)} l S Q`); return this; }
    circle(cx, cy, r, opts = {}) {
        const k = r * KAPPA;
        this.page.ops.push(['q', this._stroke(opts), `${num(cx + r)} ${num(cy)} m`,
            `${num(cx + r)} ${num(cy + k)} ${num(cx + k)} ${num(cy + r)} ${num(cx)} ${num(cy + r)} c`,
            `${num(cx - k)} ${num(cy + r)} ${num(cx - r)} ${num(cy + k)} ${num(cx - r)} ${num(cy)} c`,
            `${num(cx - r)} ${num(cy - k)} ${num(cx - k)} ${num(cy - r)} ${num(cx)} ${num(cy - r)} c`,
            `${num(cx + k)} ${num(cy - r)} ${num(cx + r)} ${num(cy - k)} ${num(cx + r)} ${num(cy)} c`, 'S', 'Q'].join(' '));
        return this;
    }
    text(str, x, y, { size = 9, gray = 0.2, align = 'left', bold = false } = {}) {
        const s = pdfString(str); const est = s.length * size * (bold ? 0.56 : 0.52); const tx = align === 'center' ? x - est / 2 : align === 'right' ? x - est : x;
        this.page.ops.push(`BT ${num(gray)} g /${bold ? 'F2' : 'F1'} ${num(size)} Tf ${num(tx)} ${num(y)} Td (${s}) Tj ET`); return this;
    }
    build() {
        const IMG0 = 5; const bodies = new Map();
        bodies.set(1, `<< /Type /Catalog /Pages 2 0 R >>`);
        bodies.set(3, `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`);
        bodies.set(4, `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`);
        this.images.forEach((img, i) => { bodies.set(IMG0 + i, { dict: `<< /Type /XObject /Subtype /Image /Width ${img.w} /Height ${img.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.jpeg.length} >>`, stream: img.jpeg }); });
        const afterImages = IMG0 + this.images.length; const pageRefs = [];
        this.pages.forEach((pg, i) => {
            const contentNo = afterImages + i * 2; const pageNo = contentNo + 1; pageRefs.push(pageNo); const content = pg.ops.join('\n');
            bodies.set(contentNo, { dict: `<< /Length ${enc.encode(content).length} >>`, stream: enc.encode(content) });
            const xobjs = [...pg.used].map((h) => `/Im${h} ${IMG0 + h} 0 R`).join(' ');
            bodies.set(pageNo, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${num(this.wPt)} ${num(this.hPt)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << ${xobjs} >> >> /Contents ${contentNo} 0 R >>`);
        });
        bodies.set(2, `<< /Type /Pages /Kids [${pageRefs.map((r) => `${r} 0 R`).join(' ')}] /Count ${pageRefs.length} >>`);
        const maxObj = Math.max(...bodies.keys()); const sink = new Sink(); const offsets = new Array(maxObj + 1).fill(0);
        sink.push('%PDF-1.4\n'); sink.push(new Uint8Array([0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));
        for (let n = 1; n <= maxObj; n++) {
            const body = bodies.get(n); if (body == null) continue; offsets[n] = sink.len; sink.push(`${n} 0 obj\n`);
            if (typeof body === 'string') { sink.push(body + '\n'); } else { sink.push(body.dict + '\nstream\n'); sink.push(body.stream); sink.push('\nendstream\n'); }
            sink.push('endobj\n');
        }
        const xrefAt = sink.len; sink.push(`xref\n0 ${maxObj + 1}\n0000000000 65535 f \n`);
        for (let n = 1; n <= maxObj; n++) sink.push(`${String(offsets[n]).padStart(10, '0')} 00000 n \n`);
        sink.push(`trailer\n<< /Size ${maxObj + 1} /Root 1 0 R >>\nstartxref\n${xrefAt}\n%%EOF\n`);
        return sink.build();
    }
}
function canvasToJpeg(canvas, quality = 0.86) {
    const url = canvas.toDataURL('image/jpeg', quality); const b64 = url.slice(url.indexOf(',') + 1); const bin = atob(b64);
    const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out;
}

const PAPER = { w: 210, h: 297 }; const CARD = { bind: 18, gap: 3, imgW: 72, imgH: 54, pad: 3 };
CARD.w = CARD.bind + CARD.gap + CARD.imgW + CARD.pad; CARD.h = CARD.imgH + CARD.pad * 2;
const GRID = { cols: 2, rows: 4, perSheet: 8 };

async function buildPrintout(pagesToPrint, onProgress) {
    const pdf = new Pdf(PAPER.w * MM, PAPER.h * MM); const sheets = Math.ceil(pagesToPrint.length / GRID.perSheet);
    const gridW = GRID.cols * CARD.w; const gridH = GRID.rows * CARD.h; const originX = (PAPER.w - gridW) / 2; const originY = (PAPER.h - gridH) / 2;
    const X = (mm) => mm * MM; const Y = (mm) => (PAPER.h - mm) * MM;
    const handles = [];
    for (let i = 0; i < pagesToPrint.length; i++) {
        const c = document.createElement('canvas'); c.width = pagesToPrint[i].width; c.height = pagesToPrint[i].height;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(pagesToPrint[i], 0, 0);
        handles.push(pdf.addImage(canvasToJpeg(c, 0.86), c.width, c.height));
        onProgress(((i + 1) / pagesToPrint.length) * 0.5); await new Promise(r => setTimeout(r, 0));
    }
    for (let s = 0; s < sheets; s++) {
        pdf.addPage();
        const onSheet = Math.min(GRID.perSheet, pagesToPrint.length - s * GRID.perSheet);
        const usedRows = Math.ceil(onSheet / GRID.cols); const usedCols = usedRows > 1 ? GRID.cols : Math.min(GRID.cols, onSheet);
        const usedH = usedRows * CARD.h; const usedW = usedCols * CARD.w;
        for (let c = 0; c <= usedCols; c++) { const x = originX + c * CARD.w; pdf.line(X(x), Y(originY), X(x), Y(originY + usedH), { gray: 0.72, width: 0.35 }); }
        for (let r = 0; r <= usedRows; r++) { const y = originY + r * CARD.h; pdf.line(X(originX), Y(y), X(originX + usedW), Y(y), { gray: 0.72, width: 0.35 }); }
        for (let k = 0; k < GRID.perSheet; k++) {
            const index = s * GRID.perSheet + k; if (index >= pagesToPrint.length) break;
            const col = k % GRID.cols; const row = Math.floor(k / GRID.cols);
            const xMm = originX + col * CARD.w; const topMm = originY + row * CARD.h;
            pdf.rect(X(xMm), Y(topMm + CARD.h), CARD.bind * MM, CARD.h * MM, { fillGray: 0.935 });
            pdf.line(X(xMm + CARD.bind), Y(topMm + CARD.h), X(xMm + CARD.bind), Y(topMm), { gray: 0.7, width: 0.4, dash: [1.4, 1.4] });
            for (const frac of [0.32, 0.68]) pdf.circle(X(xMm + CARD.bind / 2), Y(topMm + CARD.h * frac), 2 * MM, { gray: 0.68, width: 0.4, dash: [1, 1] });
            pdf.text(String(index + 1), X(xMm + CARD.bind / 2), Y(topMm + 8), { size: 13, gray: 0.42, align: 'center', bold: true });
            const ix = xMm + CARD.bind + CARD.gap; const iy = topMm + CARD.pad;
            pdf.drawImage(handles[index], X(ix), Y(iy + CARD.imgH), CARD.imgW * MM, CARD.imgH * MM);
            pdf.rect(X(ix), Y(iy + CARD.imgH), CARD.imgW * MM, CARD.imgH * MM, { gray: 0.55, width: 0.3 });
        }
        if (s === 0) {
            pdf.text('FLIPBOOTH BY DELULUPRINTER.XYZ', X(9), Y(10), { size: 10.5, gray: 0.25, bold: true });
            pdf.text('1. Cut along lines. 2. Stack in order. 3. Staple/glue grey area.', X(9), Y(15), { size: 8, gray: 0.35 });
            pdf.line(X(9), Y(PAPER.h - 12), X(59), Y(PAPER.h - 12), { gray: 0.45, width: 0.7 });
            pdf.text('|-- 50 mm --| scale check', X(62), Y(PAPER.h - 12.6), { size: 6.5, gray: 0.5 });
        }
        onProgress(0.5 + ((s + 1) / sheets) * 0.5); await new Promise(r => setTimeout(r, 0));
    }
    return pdf.build();
}

/* --- GIF EXPORT ENGINE --- */
const BIN = (r, g, b) => (((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3));
const BIN_R = (k) => (((k >> 10) & 31) << 3) | 4; const BIN_G = (k) => (((k >> 5) & 31) << 3) | 4; const BIN_B = (k) => ((k & 31) << 3) | 4;
class Bytes {
    constructor(cap = 1 << 16) { this.buf = new Uint8Array(cap); this.len = 0; }
    _room(n) { if (this.len + n <= this.buf.length) return; let cap = this.buf.length * 2; while (cap < this.len + n) cap *= 2; const next = new Uint8Array(cap); next.set(this.buf.subarray(0, this.len)); this.buf = next; }
    u8(v) { this._room(1); this.buf[this.len++] = v & 0xff; } u16(v) { this._room(2); this.buf[this.len++] = v & 0xff; this.buf[this.len++] = (v >> 8) & 0xff; }
    raw(arr) { this._room(arr.length); this.buf.set(arr, this.len); this.len += arr.length; } str(s) { for (let i = 0; i < s.length; i++) this.u8(s.charCodeAt(i)); }
    done() { return this.buf.slice(0, this.len); }
}

function buildPalette(frames) {
    const hist = new Uint32Array(32768);
    for (const f of frames) for (let i = 0; i < f.length; i += 8) hist[BIN(f[i], f[i + 1], f[i + 2])]++;
    const keys = []; for (let k = 0; k < 32768; k++) if (hist[k]) keys.push(k);
    if (!keys.length) return { palette: new Uint8Array(3), count: 1 };
    const palette = new Uint8Array(256 * 3); const count = Math.min(256, keys.length);
    for(let i=0; i<count; i++){ palette[i*3]=BIN_R(keys[i]); palette[i*3+1]=BIN_G(keys[i]); palette[i*3+2]=BIN_B(keys[i]); }
    return { palette, count };
}

function mapFrame(rgba, palette, count, out) {
    const n = rgba.length >> 2; const idx = out || new Uint8Array(n);
    const cache = new Int16Array(32768).fill(-1);
    for (let i = 0, p = 0; i < n; i++, p += 4) {
        const k = BIN(rgba[p], rgba[p+1], rgba[p+2]);
        let best = cache[k];
        if (best < 0) {
            let bd = Infinity; const cr = BIN_R(k), cg = BIN_G(k), cb = BIN_B(k);
            for (let j = 0; j < count; j++) {
                const dr = cr - palette[j*3], dg = cg - palette[j*3+1], db = cb - palette[j*3+2];
                const d = dr*dr*3 + dg*dg*6 + db*db*1;
                if (d < bd) { bd = d; best = j; }
            }
            cache[k] = best;
        }
        idx[i] = best;
    }
    return idx;
}

function lzwCompress(indices, minCodeSize) {
    const table = new Int32Array(1<<20), stamp = new Int32Array(1<<20);
    const clearCode = 1 << minCodeSize, endCode = clearCode + 1;
    let codeSize = minCodeSize + 1, next = clearCode + 2, gen = 1;
    const out = []; let cur = 0, curBits = 0;
    const emit = (code) => { cur |= code << curBits; curBits += codeSize; while (curBits >= 8) { out.push(cur & 0xff); cur >>= 8; curBits -= 8; } };
    emit(clearCode);
    if (indices.length) {
        let prefix = indices[0];
        for (let i = 1; i < indices.length; i++) {
            const k = indices[i]; const key = (prefix << 8) | k;
            if (stamp[key] === gen) { prefix = table[key]; continue; }
            emit(prefix);
            if (next === 4096) { emit(clearCode); gen++; next = clearCode + 2; codeSize = minCodeSize + 1; }
            else { stamp[key] = gen; table[key] = next; next++; if (next > (1 << codeSize) && codeSize < 12) codeSize++; }
            prefix = k;
        }
        emit(prefix);
    }
    emit(endCode); if (curBits > 0) out.push(cur & 0xff);
    const blocks = new Bytes(out.length + (out.length >> 8) + 8);
    for (let i = 0; i < out.length; i += 255) { const n = Math.min(255, out.length - i); blocks.u8(n); for (let j = 0; j < n; j++) blocks.u8(out[i + j]); }
    blocks.u8(0); return blocks.done();
}

async function buildGif(pagesToExport, speedFps, onProgress) {
    const w = 480, h = 360; const delayCs = Math.max(2, Math.round(100 / speedFps));
    const c = document.createElement('canvas'); c.width = w; c.height = h; const ctx = c.getContext('2d', { willReadFrequently: true });
    const rgba = [];
    for(let i=0; i<pagesToExport.length; i++) { ctx.drawImage(pagesToExport[i], 0, 0, w, h); rgba.push(ctx.getImageData(0,0,w,h).data); onProgress((i+1)/pagesToExport.length * 0.3); await new Promise(r=>setTimeout(r,1)); }
    const { palette, count } = buildPalette(rgba); onProgress(0.4); await new Promise(r=>setTimeout(r,1));
    const frames = [];
    for (let i = 0; i < rgba.length; i++) {
        frames.push(mapFrame(rgba[i], palette, count));
        onProgress(0.4 + ((i+1)/rgba.length)*0.4); await new Promise(r=>setTimeout(r,1));
    }
    const gif = new Bytes(1<<20); let bits = 1; while ((1<<bits) < count+1) bits++;
    gif.str('GIF89a'); gif.u16(w); gif.u16(h); gif.u8(0x80 | ((bits-1)<<4) | (bits-1)); gif.u8(0); gif.u8(0);
    for (let i=0; i < (1<<bits); i++) { gif.u8(i<count?palette[i*3]:0); gif.u8(i<count?palette[i*3+1]:0); gif.u8(i<count?palette[i*3+2]:0); }
    gif.u8(0x21); gif.u8(0xff); gif.u8(11); gif.str('NETSCAPE2.0'); gif.u8(3); gif.u8(1); gif.u16(0); gif.u8(0); // loop
    for (let i=0; i < frames.length; i++) {
        gif.u8(0x21); gif.u8(0xf9); gif.u8(4); gif.u8(1<<2); gif.u16(delayCs); gif.u8(0); gif.u8(0); // graphics control
        gif.u8(0x2c); gif.u16(0); gif.u16(0); gif.u16(w); gif.u16(h); gif.u8(0); // desc
        const minCode = Math.max(2, bits); gif.u8(minCode); gif.raw(lzwCompress(frames[i], minCode));
        onProgress(0.8 + ((i+1)/frames.length)*0.2); await new Promise(r=>setTimeout(r,1));
    }
    gif.u8(0x3b); return gif.done();
}

async function saveFile(bytes, name, mime) {
    const blob = new Blob([bytes], { type: mime }); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 20000);
}

/* --- APP LOGIC --- */
const els = {
    body: document.body, book: document.getElementById('book'), video: document.getElementById('video'),
    fakecam: document.getElementById('fakecam'), countdown: document.getElementById('countdown'),
    recbadge: document.getElementById('recbadge'), framecount: document.getElementById('framecount'),
    flash: document.getElementById('flash'), shots: document.getElementById('shots'),
    stitchfill: document.getElementById('stitchfill'), scrub: document.getElementById('scrub'),
    scrubmark: document.getElementById('scrubmark'), pagelabel: document.getElementById('pagelabel'),
    paces: document.getElementById('paces'), speeds: document.getElementById('speeds'),
    stitchtext: document.getElementById('stitchtext'), videoUpload: document.getElementById('video-upload')
};

let flipbook = null, pages = [], stream = null, verso = null, scene = 'intro', recordAbort = null;
let pace = PACES[1], speed = SPEEDS[1];

function setScene(name) {
    scene = name; els.body.dataset.scene = name;
    if (name === 'book' || name === 'intro') requestAnimationFrame(() => flipbook?.resize());
}

function renderPickers() {
    els.paces.innerHTML = PACES.map(p => `<button class="pace-pill" data-pace="${p.id}" aria-checked="${pace.id === p.id}">${p.label}</button>`).join('');
    els.speeds.innerHTML = SPEEDS.map(s => `<button class="speed-pill" data-speed="${s.id}" aria-checked="${speed.id === s.id}">${s.label}</button>`).join('');
}

async function goLive() {
    setScene('live');
    try { stream = await startCamera(els.video); } catch (e) { setScene('intro'); showError("Camera Error", e.reason); }
}

async function runRecording() {
    const ac = new AbortController(); recordAbort = ac; els.shots.innerHTML = '';
    try {
        setScene('countdown'); unlock();
        await countdown(3, (left) => { els.countdown.innerHTML = left > 0 ? `<span>${left}</span>` : '<span>GO!</span>'; tickSfx(); }, ac.signal);
        els.countdown.innerHTML = '';
        setScene('recording'); els.recbadge.hidden = false;
        
        const raw = await recordFrames(els.video, {
            count: FRAME_COUNT, fps: pace.fps, signal: ac.signal,
            onFrame: (n, total, frame) => {
                els.framecount.textContent = `${String(n).padStart(2, '0')}/${String(total).padStart(2, '0')}`;
                els.flash.classList.remove('pop'); void els.flash.offsetWidth; els.flash.classList.add('pop');
                const c = document.createElement('canvas'); c.width = 40; c.height = 30;
                c.getContext('2d').drawImage(frame, 0, 0, 40, 30);
                els.shots.appendChild(c); shutter();
            }
        });
        els.recbadge.hidden = true; stream?.getTracks().forEach(t => t.stop()); stream = null;
        await buildBook(raw);
    } catch (e) { if (e.reason === 'cancelled') setScene('intro'); } finally { recordAbort = null; }
}

els.videoUpload.addEventListener('change', async (e) => {
    const file = e.target.files[0]; if (!file) return;
    try {
        setScene('stitch'); els.stitchtext.innerHTML = 'Extracting Frames...'; els.stitchfill.style.width = '0%';
        const rawFrames = await extractFramesFromVideo(file, FRAME_COUNT, (p) => { els.stitchfill.style.width = `${p * 50}%`; });
        els.stitchtext.innerHTML = 'Stitching Flipbook...';
        await buildBook(rawFrames, 0.5);
    } catch(err) { showError("Video Processing", err); setScene('intro'); }
});

const yieldToBrowser = () => new Promise(r => setTimeout(r, 0));

async function buildBook(rawFrames, progressOffset = 0) {
    setScene('stitch'); const scale = 1.0 - progressOffset;
    setBindEdge(window.matchMedia('(orientation: portrait) and (max-width: 640px)').matches ? 'top' : 'left');
    pages = [];
    for(let i=0; i<rawFrames.length; i++){
        pages.push(composePage(rawFrames[i], { index: i, total: rawFrames.length, mirror: false }));
        els.stitchfill.style.width = `${(progressOffset + (i / rawFrames.length) * scale) * 100}%`; await yieldToBrowser();
    }
    verso = composeVerso(); flipbook.setFrames(pages, verso); setScene('book');
    setTimeout(() => { flipbook.play(); updatePlayBtn(); }, 500);
}

function updatePlayBtn() { document.getElementById('play-btn').textContent = flipbook.playing ? 'STOP' : 'FLIP IT!'; }

const ACTIONS = {
    start: () => goLive(),
    'back-intro': () => { stream?.getTracks().forEach(t => t.stop()); stream = null; setScene('intro'); },
    record: () => runRecording(),
    'cancel-record': () => recordAbort?.abort(),
    'use-demo': async () => { setScene('stitch'); await buildBook(demoFrames(24)); },
    play: () => { unlock(); flipbook.toggle(); updatePlayBtn(); },
    prev: () => { flipbook.prev(); updatePlayBtn(); },
    next: () => { flipbook.next(); updatePlayBtn(); },
    again: () => { flipbook.stop(); updatePlayBtn(); setScene('intro'); },
    gif: async () => { 
        const btn = document.getElementById('btn-gif'); const orig = btn.innerHTML; btn.innerHTML = "Saving...";
        try { const bytes = await buildGif(pages, speed.fps, (p) => { btn.innerHTML = `Saving... ${Math.round(p*100)}%`; }); await saveFile(bytes, 'flipbooth.gif', 'image/gif'); } 
        catch(e) { showError('GIF Export', e); } finally { btn.innerHTML = orig; }
    },
    print: async () => { 
        const btn = document.getElementById('btn-print'); const orig = btn.innerHTML; btn.innerHTML = "Building PDF...";
        try { const bytes = await buildPrintout(pages, (p) => { btn.innerHTML = `Building PDF... ${Math.round(p*100)}%`; }); await saveFile(bytes, 'flipbooth_print.pdf', 'application/pdf'); } 
        catch(e) { showError('PDF Export', e); } finally { btn.innerHTML = orig; }
    }
};

document.addEventListener('click', (e) => {
    const paceBtn = e.target.closest('[data-pace]'); if (paceBtn) { pace = paceById(paceBtn.dataset.pace); renderPickers(); }
    const speedBtn = e.target.closest('[data-speed]'); if (speedBtn) { speed = speedById(speedBtn.dataset.speed); flipbook.setSpeed(speed.fps); renderPickers(); }
    const btn = e.target.closest('[data-act]'); if (btn) { const fn = ACTIONS[btn.dataset.act]; if(fn) fn(); }
});

let scrubbing = false;
els.scrub.addEventListener('pointerdown', (e) => { scrubbing = true; els.scrub.setPointerCapture?.(e.pointerId); });
els.scrub.addEventListener('pointermove', (e) => {
    if (!scrubbing || !flipbook.total) return; const rect = els.scrub.getBoundingClientRect();
    flipbook.setPosition(Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * (flipbook.total - 1));
});
window.addEventListener('pointerup', () => { scrubbing = false; });

function boot() {
    renderPickers();
    flipbook = createFlipbook(els.book, {
        onFlip: () => { if (scene === 'book' || scene === 'intro') riffle(); },
        onUpdate: ({ position, page, total }) => {
            if (!total) return;
            els.scrubmark.style.left = `${Math.max(0, Math.min(1, position / (total - 1))) * 100}%`;
            els.pagelabel.textContent = `Page ${page + 1} of ${total}`;
        }
    });
    flipbook.setSpeed(speed.fps);
    window.addEventListener('resize', () => flipbook.resize());
}
boot();

})();
